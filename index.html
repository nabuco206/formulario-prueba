<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Formulario público de prueba para nombre y edad.">
  <title>Formulario de prueba</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f6fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 440px);
      padding: 32px;
      border: 1px solid #e1e7f0;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 36px rgb(23 32 51 / 8%);
    }

    h1 { margin: 0 0 8px; font-size: 1.65rem; }
    .intro { margin: 0 0 24px; color: #566176; line-height: 1.5; }
    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 7px; font-weight: 650; }

    input {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid #bac5d6;
      border-radius: 8px;
      font: inherit;
    }

    input:focus-visible, button:focus-visible {
      outline: 3px solid #93b7ff;
      outline-offset: 2px;
    }

    button {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      background: #245cdb;
      color: #fff;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover { background: #174bbd; }
    .notice { margin: 16px 0 0; color: #21643b; line-height: 1.5; }
    .privacy { margin: 18px 0 0; color: #667085; font-size: .88rem; line-height: 1.5; }
    [hidden] { display: none; }

    @media (max-width: 480px) {
      main { padding: 24px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Formulario de prueba</h1>
    <p class="intro">Completa tus datos para probar el formulario.</p>

    <form id="test-form">
      <div class="field">
        <label for="name">Nombre</label>
        <input id="name" name="name" type="text" autocomplete="name" maxlength="100" required>
      </div>
      <div class="field">
        <label for="age">Edad</label>
        <input id="age" name="age" type="number" inputmode="numeric" min="0" max="120" step="1" required>
      </div>
      <button type="submit">Enviar</button>
      <p id="confirmation" class="notice" role="status" aria-live="polite" hidden></p>
    </form>

    <p class="privacy">Es una demostración: al enviar, los datos no se guardan ni se comparten.</p>
  </main>
  <script>
    // Pega aquí los datos de tu proyecto Supabase (Project Settings → API).
    // La clave "anon/publishable" es pública por diseño; la seguridad la da setup.sql.
    const SUPABASE_URL = '';
    const SUPABASE_KEY = '';

    const form = document.querySelector('#test-form');
    const confirmation = document.querySelector('#confirmation');
    const privacy = document.querySelector('.privacy');
    const submitButton = form.querySelector('button');
    const saving = Boolean(SUPABASE_URL && SUPABASE_KEY);

    if (saving) {
      privacy.textContent = 'Al enviar, tu nombre y edad se guardarán para fines de prueba.';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;

      const name = form.elements.name.value.trim();
      const age = Number(form.elements.age.value);
      confirmation.hidden = false;
      confirmation.style.color = '';

      if (saving) {
        submitButton.disabled = true;
        try {
          const response = await fetch(`${SUPABASE_URL}/rest/v1/respuestas`, {
            method: 'POST',
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`,
              'Content-Type': 'application/json',
              Prefer: 'return=minimal'
            },
            body: JSON.stringify({ nombre: name, edad: age })
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
        } catch (error) {
          confirmation.textContent = 'No se pudo guardar. Inténtalo de nuevo.';
          confirmation.style.color = '#b42318';
          submitButton.disabled = false;
          return;
        }
        submitButton.disabled = false;
      }

      confirmation.textContent = `¡Gracias, ${name}! El formulario se envió correctamente.`;
      form.reset();
    });
  </script>
</body>
</html>
